; ============================================================
; folders.ini
;
; Настройки инвентаризации структуры папок
; ============================================================

[OPTIONS]
; Сортировать папки по алфавиту.
; Для больших хранилищ можно отключить для скорости.
sort_dirs = false

; Глубина сканирования.
; 0 - без ограничения.
; 1 - корень и первый уровень.
; 2 - корень, первый уровень и второй уровень.
max_depth = 2

; Обходить символические ссылки/junction.
; Для сетевого хранилища обычно безопаснее false.
follow_symlinks = false

; Кодировка CSV.
; utf-8-sig удобно для Excel.
encoding = utf-8-sig

; Разделитель CSV.
; Доступно: semicolon, comma, tab.
delimiter = semicolon

; Что писать в качестве корня:
; name - только имя корневой папки;
; path - полный путь корня.
;
; Если корней несколько и важна однозначность, рекомендую path.
root_label = name

; ============================================================
; Корневые папки для инвентаризации.
; Секция должна называться [ROOTS] или [FOLDERS].
; Имена ключей могут быть любыми.
; ============================================================

[ROOTS]
root = z:\0 - Реквизиты\
        z:\0 - Общая\01 Скан-ые документы(договоры,накладные и тд)\Сканированные (договоры, накладные и тд)\
        z:\0 - Учеба\
	z:\0 - Объекты\Объекты Стройка\


; Можно также перечислить несколько путей в одном ключе:
; roots =
;     \\fileserver\documents
;     \\fileserver\projects
