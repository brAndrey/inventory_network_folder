; ============================================================
; config.ini — конфигурация мониторинга сетевых папок
;
; Секция [ROOTS] имеет особый формат:
;   ключ = путь;глубина
; где глубина — индивидуальная глубина сканирования:
;   0  — только сама корневая папка (без входа внутрь);
;   1  — корень + папки первого уровня;
;   -1 — без ограничения глубины;
;   N  — корень + N уровней вложенности.
;
; Если глубина не указана (строка без ';'), считается -1.
; ============================================================

[ROOTS]
root1 = 

; Примеры для UNC-путей и разных глубин:
; root5 = \\fileserver\documents;3
; root6 = \\fileserver\archive;1
; root7 = \\fileserver\hr;-1

[OPTIONS]
; Файл базы данных SQLite (относительно папки скрипта).
db_path = folder_monitor.db

; Папки для логов и отчётов.
log_dir = Log
report_dir = Reports

; Сколько дней хранить сканы (более старые удаляются).
retention_days = 7

; Порог аномального уменьшения количества файлов в папке.
; Событие срабатывает только при одновременном выполнении обоих порогов.
file_count_decrease_percent = 20
file_count_decrease_min = 10

; Максимальное время сканирования в минутах.
scan_timeout_minutes = 55

; Считать ли скрытые/служебные файлы (desktop.ini, thumbs.db, .*).
count_hidden_files = true

; Оповещения по e-mail.
; Письмо отправляется ТОЛЬКО при значимых изменениях:
;   - папка перемещена;
;   - папка удалена;
;   - аномальное уменьшение количества файлов.
; Если изменений нет — письмо не отправляется.
[ALERTS]
enabled = true
email_to = 
; email_from — адрес отправителя (если не указан, берётся email_to).
email_from = 
smtp_server = smtp.mail.ru
smtp_port = 587

; Авторизация SMTP. Если smtp_user не задан — авторизация не выполняется.
; ВАЖНО про пароль: не храните его открытым текстом в этом файле.
; Рекомендуемый способ — задать переменную окружения MONITOR_SMTP_PASSWORD
; (в Планировщике задач или в системе); она имеет приоритет над smtp_password.
smtp_user = 
smtp_password = 
